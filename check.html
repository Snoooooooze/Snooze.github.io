<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Site check</title>
  <style>
    body { margin: 0; padding: 32px 20px 64px; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: #111; background: #fff; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    p.sub { color: #555; margin: 0 0 28px; }
    h2 { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #555; margin: 32px 0 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e5e5; vertical-align: top; }
    .ok { color: #0a7a3d; font-weight: 600; }
    .bad { color: #b00020; font-weight: 600; }
    .warn { color: #8a5a00; font-weight: 600; }
    code { background: #f1f1f1; padding: 1px 6px; border-radius: 6px; font-size: 14px; }
    .box { margin-top: 28px; padding: 14px 16px; border: 1px solid #ddd; border-radius: 12px; background: #fafafa; }
  </style>
</head>
<body>
<main>
  <h1>Site check</h1>
  <p class="sub">This page tests which files your live site can find. Open it on your site, then send me a screenshot.</p>

  <h2>Scripts</h2>
  <table id="scripts"><thead><tr><th>File</th><th>Result</th><th>What it means</th></tr></thead><tbody></tbody></table>

  <h2>Case study files (content folder)</h2>
  <table id="content"><thead><tr><th>Project</th><th>.txt file</th><th>What it means</th></tr></thead><tbody></tbody></table>

  <div class="box" id="summary">Checking&hellip;</div>
  <p class="sub" style="margin-top:20px">Address checked: <code id="where"></code></p>
</main>

<script>
(function () {
  var EXPECTED = ['better-bonds', 'radio', 'grassroots', 'charmful', 'cnc-furniture'];   // projects that should have a case study
  var ALL = ['voice-search', 'radio', 'better-bonds', 'future-vehicle', 'cnc-furniture', 'grassroots', 'charmful'];
  var base = location.href.replace(/[^\/]*$/, '');
  document.getElementById('where').textContent = base;
  var problems = [];

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  // One request at a time. If GitHub answers with a temporary 5xx error, try again up to 3 times.
  function get(path, tries) {
    tries = tries || 3;
    return fetch(base + path, { cache: 'no-store' })
      .then(function (r) { return r.text().then(function (t) { return { status: r.status, ok: r.ok, text: t }; }); })
      .catch(function () { return { status: 0, ok: false, text: '' }; })
      .then(function (res) {
        if ((res.status >= 500 || res.status === 0) && tries > 1) return wait(900).then(function () { return get(path, tries - 1); });
        return res;
      });
  }
  function label(res) {
    if (res.ok) return '<span class="ok">found (' + res.status + ')</span>';
    if (res.status === 404) return '<span class="bad">not found (404)</span>';
    return '<span class="warn">server error (' + res.status + ')</span>';
  }
  function row(id, cells) {
    var tr = document.createElement('tr');
    tr.innerHTML = cells.map(function (c) { return '<td>' + c + '</td>'; }).join('');
    document.querySelector('#' + id + ' tbody').appendChild(tr);
  }

  var files = ['site.js', 'case-study.js', 'index.html', 'case-study.html'];
  var chain = Promise.resolve();
  files.forEach(function (f) {
    chain = chain.then(function () { return get(f); }).then(function (r) {
      var note = 'Present.';
      if (!r.ok) { note = r.status === 404 ? 'Missing. Upload this file to the main folder of your repo.' : 'GitHub gave a temporary error. Run this check again in a minute.'; problems.push(f + ': ' + (r.status === 404 ? 'missing' : 'server error ' + r.status)); }
      else if (f === 'site.js' || f === 'case-study.js') {
        var fresh = r.text.indexOf("probe(") > -1 || r.text.indexOf("load(") > -1;
        note = fresh ? 'Up to date.' : '<span class="warn">Old version.</span> Upload the newest ' + f + ' again.';
        if (!fresh) problems.push(f + ' is an old version');
      }
      row('scripts', [f, label(r), note]);
    });
  });
  ALL.forEach(function (s) {
    chain = chain.then(function () { return get('content/' + s + '.txt'); }).then(function (t) {
      var needs = EXPECTED.indexOf(s) > -1, note, md = null;
      if (t.ok && /^\s*(\+\+\+|---)/.test(t.text)) note = 'Good. This case study will open.';
      else if (t.ok) { note = '<span class="warn">File found, but it should start with a +++ line.</span>'; problems.push(s + '.txt has no +++ header'); }
      else if (t.status === 404 && needs) { note = '<span class="bad">Missing.</span> Upload ' + s + '.txt into the content folder.'; problems.push(s + '.txt is missing'); }
      else if (t.status === 404) note = 'No file, so this project shows the "restricted" toast. Expected.';
      else { note = '<span class="warn">GitHub gave a temporary error.</span> The file probably exists. Run this check again.'; problems.push(s + '.txt: server error ' + t.status); }
      row('content', [s, label(t), note]);
    });
  });
  chain.then(function () {
    var box = document.getElementById('summary');
    if (!problems.length) box.innerHTML = '<strong class="ok">No problems found.</strong> Every project that should open has its file.';
    else box.innerHTML = '<strong class="bad">Found ' + problems.length + ' problem' + (problems.length > 1 ? 's' : '') + ':</strong><ul><li>' + problems.join('</li><li>') + '</li></ul>';
  });
})();
</script>
</body>
</html>
