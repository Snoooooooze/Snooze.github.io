<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name – UX Designer</title>
  <meta name="description" content="UX designer focused on research-led product design.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f0f0f0;
      --ink: #1e1e1e;
      --muted: #6b6b6b;
      --pink: #d9008d;
      --block: #dcdcde;
      --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 300 1.0625rem/1.6 var(--sans);
      overflow-x: hidden;
    }
    a { color: var(--pink); }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .wrap { max-width: 68rem; margin: 0 auto; padding: 0 1.5rem; }

    /* Header */
    .site-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; padding-top: 2rem; padding-bottom: 2rem; }
    .logo { font-size: 1.35rem; font-weight: 400; color: var(--ink); text-decoration: none; }
    .logo span { color: var(--pink); }
    nav { display: flex; gap: 2rem; font-family: var(--mono); font-size: 0.95rem; }
    nav a { text-decoration: none; padding-bottom: 0.25rem; border-bottom: 2px solid transparent; }
    nav a[aria-current="page"] { font-weight: 600; border-bottom-color: var(--pink); }
    nav a:hover { border-bottom-color: var(--pink); }

    /* Hero */
    .hero { padding: 6rem 0 5rem; }
    .hero h1 { font-size: clamp(2.25rem, 6vw, 4rem); font-weight: 400; line-height: 1.15; max-width: 16em; margin: 0 0 1.75rem; letter-spacing: -0.01em; }
    .hero h1 em { font-style: normal; color: var(--pink); }
    .hero p { color: var(--muted); font-size: 1.15rem; margin: 0; }
    .hero p strong { font-weight: 400; color: var(--pink); }
